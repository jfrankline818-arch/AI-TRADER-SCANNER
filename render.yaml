
services:
  - type: web
    name: trader-activity-scanner
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_PATH
        value: /var/data/trader_scanner.db

    disk:
      name: trader-scanner-data
      mountPath: /var/data
      sizeGB: 1
